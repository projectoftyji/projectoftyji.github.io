<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonu & Janu ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container" id="loginScreen">
        <div class="heart">❤️</div>
        <h1>Sonu & Janu</h1>
        <p class="subtitle">Our Private World</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Enter your email" required>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="submit">Login ❤️</button>
        </form>

        <p id="message"></p>
    </div>

    <div class="login-container" id="chatScreen" style="display:none;">
        <h1>Sonu & Janu ❤️</h1>
        <p>Welcome to Our Private Chat!</p>
        <div id="chatMessages"></div>
        <input type="text" id="chatInput" placeholder="Write a message...">
        <button id="sendButton">Send ❤️</button>
        <button id="logoutButton">Logout</button>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
